spring.application.name=ms-storage
server.port=8088

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# MySQL (metadatos)
spring.datasource.url=jdbc:mysql://localhost:3306/db_storage
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update


# Google Cloud Storage
spring.cloud.gcp.credentials.location=classpath:storagekey.json
spring.cloud.gcp.project-id=storage-496403
spring.cloud.gcp.storage.bucket=frikitienda_img

#Limitacion en tamano de archivos
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB